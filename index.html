<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DDLC OS Status</title>
<meta name="description" content="Live progress of the DDLC OS build, SD card test, write and check.">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322c55e'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #0f172a; --dim: #64748b; --line: #e2e8f0;
    --track: #e8edf3; --run: #2563eb; --done: #16a34a; --fail: #dc2626; --wait: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --dim: #8b949e; --line: #262c36;
            --track: #222a35; --run: #58a6ff; --done: #3fb950; --fail: #f85149; --wait: #6e7681; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .conn { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); }
  .dot.on { background: var(--done); } .dot.off { background: var(--fail); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .hero { display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 92px; height: 92px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700;
               font-variant-numeric: tabular-nums; }
  .state { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--run); }
  .state.done { color: var(--done); } .state.failed { color: var(--fail); } .state.idle { color: var(--wait); }
  .headline { font-size: 16px; font-weight: 600; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .age { font-size: 12px; color: var(--dim); }
  .step { padding: 12px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 0; padding-top: 0; } .step:last-child { padding-bottom: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .icon { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center;
          font-size: 12px; font-weight: 700; color: #fff; background: var(--wait); }
  .icon.run { background: var(--run); } .icon.done { background: var(--done); } .icon.fail { background: var(--fail); }
  .icon.run::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .name { font-weight: 600; flex: 1; }
  .num { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }
  .detail { color: var(--dim); font-size: 13px; margin: 4px 0 8px 32px; overflow-wrap: anywhere; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-left: 32px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--run); border-radius: 3px; transition: width .6s; }
  .bar i.done { background: var(--done); } .bar i.fail { background: var(--fail); } .bar i.wait, .bar i.skip { background: var(--wait); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
        overflow-wrap: anywhere; color: var(--dim); }
  .empty { color: var(--dim); text-align: center; padding: 28px 0; }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>DDLC OS · SD card</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="conn">connecting</span></div>
  </header>

  <section class="card" id="heroCard">
    <div class="hero">
      <div class="ring">
        <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true">
          <circle cx="46" cy="46" r="40" fill="none" stroke="var(--track)" stroke-width="9"/>
          <circle id="arc" cx="46" cy="46" r="40" fill="none" stroke="var(--run)" stroke-width="9"
                  stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"
                  style="transition: stroke-dashoffset .6s"/>
        </svg>
        <div class="pct" id="pct">–</div>
      </div>
      <div>
        <div class="state idle" id="state">waiting</div>
        <div class="headline" id="headline">Waiting for the laptop to report…</div>
        <div class="age" id="age"></div>
      </div>
    </div>
  </section>

  <section class="card" id="steps"><div class="empty">No status yet</div></section>

  <section class="card">
    <h2>Recent log</h2>
    <pre id="log">–</pre>
  </section>

  <footer>Live from the laptop over MQTT · broker.hivemq.com</footer>
</main>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
  const TOPIC = "ddlc-os/afkar3374/status";
  const $ = (id) => document.getElementById(id);
  const ICON = { done: "✓", fail: "!", skip: "–", wait: "", run: "" };
  const STATE_TEXT = { running: "in progress", done: "finished", failed: "stopped", idle: "waiting" };
  let last = null, gotAt = 0;

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function render(st) {
    last = st;
    const pct = Math.max(0, Math.min(100, st.overall | 0));
    $("pct").textContent = pct + "%";
    const arc = $("arc");
    arc.style.strokeDashoffset = 251.3 * (1 - pct / 100);
    arc.setAttribute("stroke", st.state === "done" ? "var(--done)" : st.state === "failed" ? "var(--fail)" : "var(--run)");
    $("state").textContent = STATE_TEXT[st.state] || st.state;
    $("state").className = "state " + st.state;
    $("headline").textContent = st.headline;
    $("steps").innerHTML = st.steps.map((s) => `
      <div class="step">
        <div class="row"><span class="icon ${s.state}">${ICON[s.state] ?? ""}</span>
          <span class="name">${esc(s.name)}</span><span class="num">${s.state === "wait" ? "" : s.pct + "%"}</span></div>
        <div class="detail">${esc(s.detail)}</div>
        <div class="bar"><i class="${s.state}" style="width:${s.pct}%"></i></div>
      </div>`).join("");
    $("log").textContent = (st.log || []).join("\n") || "–";
    document.title = (st.state === "done" ? "✓ " : st.state === "failed" ? "! " : pct + "% ") + "DDLC OS Status";
    tick();
  }

  // Age is measured from when THIS phone received the last message (phone clock vs laptop clock may differ).
  function tick() {
    if (!last) return;
    const s = Math.max(0, Math.round((Date.now() - gotAt) / 1000));
    const ago = s < 60 ? s + " s ago" : Math.floor(s / 60) + " min ago";
    const stale = s > 20 && last.state === "running";
    $("age").textContent = "Updated " + ago + (stale ? " · reconnecting…" : "");
    $("age").style.color = stale ? "var(--fail)" : "";
  }
  setInterval(tick, 1000);

  // Phones often drop the WebSocket silently (screen off, network switch): if nothing arrives for 15 s, reconnect.
  setInterval(() => {
    if (gotAt && Date.now() - gotAt > 15000 && last && last.state === "running") {
      gotAt = Date.now() - 10000;
      setConn("reconnecting", "");
      client.end(true, () => client.reconnect());
    }
  }, 5000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && gotAt && Date.now() - gotAt > 8000) client.end(true, () => client.reconnect());
  });

  function setConn(text, cls) { $("conn").textContent = text; $("dot").className = "dot " + cls; }

  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
    clientId: "ddlc-os-view-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000, connectTimeout: 10000, clean: true,
  });
  client.on("connect", () => { setConn("live", "on"); client.subscribe(TOPIC); });
  client.on("reconnect", () => setConn("reconnecting", ""));
  client.on("offline", () => setConn("offline", "off"));
  client.on("error", () => setConn("error", "off"));
  client.on("message", (t, buf) => { try { gotAt = Date.now(); render(JSON.parse(buf.toString())); setConn("live", "on"); } catch (e) {} });

  // Remove the old SMART LAB offline cache from phones that installed it.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
  }
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
</script>
</body>
</html>
