<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DDLC OS Tracker</title>
<meta name="description" content="Live progress of a DDLC OS SD card flash. Enter the 3-digit tracking ID from ddlc-flash.">
<meta name="theme-color" content="#002d07">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23008100'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f7f4; --card: #ffffff; --text: #0f1a12; --dim: #5d6b61; --line: #e1e8e2;
    --track: #e6ece7; --run: #008100; --done: #15803d; --fail: #dc2626; --warn: #d97706; --wait: #94a3b8;
    --brand: #002d07;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b120d; --card: #131c16; --text: #e7efe9; --dim: #8fa096; --line: #233027;
            --track: #1f2a22; --run: #3fb950; --done: #3fb950; --fail: #f85149; --warn: #e3a008; --wait: #6e7681;
            --brand: #3fb950; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 b { color: var(--brand); }
  .conn { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); }
  .dot.on { background: var(--done); } .dot.off { background: var(--fail); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .hero { display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 92px; height: 92px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700;
               font-variant-numeric: tabular-nums; }
  .state { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--run); }
  .state.done { color: var(--done); } .state.failed { color: var(--fail); } .state.idle { color: var(--wait); }
  .headline { font-size: 16px; font-weight: 600; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .age, .meta { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .step { padding: 12px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 0; padding-top: 0; } .step:last-child { padding-bottom: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .icon { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center;
          font-size: 12px; font-weight: 700; color: #fff; background: var(--wait); }
  .icon.run { background: var(--run); } .icon.done { background: var(--done); } .icon.fail { background: var(--fail); }
  .icon.warn { background: var(--warn); }
  .icon.run::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .name { font-weight: 600; flex: 1; }
  .num { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }
  .detail { color: var(--dim); font-size: 13px; margin: 4px 0 8px 32px; overflow-wrap: anywhere; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-left: 32px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--run); border-radius: 3px; transition: width .6s; }
  .bar i.done { background: var(--done); } .bar i.fail { background: var(--fail); } .bar i.warn { background: var(--warn); }
  .bar i.wait, .bar i.skip { background: var(--wait); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
        overflow-wrap: anywhere; color: var(--dim); }
  .empty { color: var(--dim); text-align: center; padding: 20px 0; }
  form { display: flex; gap: 10px; margin-top: 12px; }
  input { flex: 1; min-width: 0; font: 600 28px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .4em;
          text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
          background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--run); outline-offset: 1px; }
  button { font: 600 15px system-ui, sans-serif; padding: 0 18px; border: 0; border-radius: 10px;
           background: var(--run); color: #fff; cursor: pointer; }
  button.link { background: none; color: var(--run); padding: 0; font-weight: 600; }
  .hint { color: var(--dim); font-size: 13px; margin: 8px 0 0; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--track); padding: 1px 5px; border-radius: 5px; }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1><b>DDLC OS</b> tracker</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="conn">offline</span></div>
  </header>

  <!-- ID entry -->
  <section class="card" id="ask">
    <h2>Track an SD card flash</h2>
    <div>Enter the 3-digit tracking ID that Claude Code (or <code>ddlc-flash</code>) gave you.</div>
    <form id="form" autocomplete="off">
      <input id="idbox" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" placeholder="123" aria-label="3-digit tracking ID" required>
      <button type="submit">Track</button>
    </form>
    <p class="hint" id="askerr" hidden></p>
  </section>

  <!-- live view -->
  <div id="view" hidden>
    <section class="card">
      <div class="hero">
        <div class="ring">
          <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true">
            <circle cx="46" cy="46" r="40" fill="none" stroke="var(--track)" stroke-width="9"/>
            <circle id="arc" cx="46" cy="46" r="40" fill="none" stroke="var(--run)" stroke-width="9"
                    stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"
                    style="transition: stroke-dashoffset .6s"/>
          </svg>
          <div class="pct" id="pct">–</div>
        </div>
        <div>
          <div class="state idle" id="state">waiting</div>
          <div class="headline" id="headline">Waiting for flash #<span id="idshow"></span>…</div>
          <div class="meta" id="meta"></div>
          <div class="age" id="age"></div>
        </div>
      </div>
    </section>
    <section class="card" id="steps"><div class="empty" id="nodata">No status for this ID yet. Is the flash running?</div></section>
    <section class="card">
      <h2>Recent log</h2>
      <pre id="log">–</pre>
    </section>
    <div style="text-align:center"><button class="link" id="other">Track another ID</button></div>
  </div>

  <footer>Live over MQTT · broker.hivemq.com · topic <code id="topic">ddlc-os/track/…</code></footer>
</main>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const ICON = { done: "✓", fail: "!", warn: "!", skip: "–", wait: "", run: "" };
  const STATE_TEXT = { running: "in progress", done: "finished", failed: "stopped", idle: "waiting" };
  let client = null, topic = null, last = null, gotAt = 0;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function setConn(text, cls) { $("conn").textContent = text; $("dot").className = "dot " + cls; }

  function render(st) {
    last = st;
    const pct = Math.max(0, Math.min(100, st.overall | 0));
    $("pct").textContent = pct + "%";
    $("arc").style.strokeDashoffset = 251.3 * (1 - pct / 100);
    $("arc").setAttribute("stroke", st.state === "done" ? "var(--done)" : st.state === "failed" ? "var(--fail)" : "var(--run)");
    $("state").textContent = STATE_TEXT[st.state] || st.state;
    $("state").className = "state " + st.state;
    $("headline").textContent = st.headline;
    $("meta").textContent = [st.image, st.device].filter(Boolean).join(" → ");
    $("steps").innerHTML = (st.steps || []).map((s) => `
      <div class="step">
        <div class="row"><span class="icon ${esc(s.state)}">${ICON[s.state] ?? ""}</span>
          <span class="name">${esc(s.name)}</span><span class="num">${s.state === "wait" || s.state === "skip" ? "" : (s.pct | 0) + "%"}</span></div>
        <div class="detail">${esc(s.detail)}</div>
        <div class="bar"><i class="${esc(s.state)}" style="width:${s.pct | 0}%"></i></div>
      </div>`).join("");
    $("log").textContent = (st.log || []).join("\n") || "–";
    document.title = (st.state === "done" ? "✓ " : st.state === "failed" ? "! " : pct + "% ") + "DDLC OS Tracker";
    tick();
  }

  // Age is measured from when THIS device received the message (phone and laptop clocks may differ).
  function tick() {
    if (!last) return;
    const s = Math.max(0, Math.round((Date.now() - gotAt) / 1000));
    const lag = Math.round(Date.now() / 1000 - last.t);
    const ago = s < 60 ? s + " s ago" : Math.floor(s / 60) + " min ago";
    const finished = last.state !== "running";
    const old = finished && lag > 3600 ? " · from " + new Date(last.t * 1000).toLocaleString() : "";
    const stale = !finished && s > 20;
    $("age").textContent = "Updated " + ago + old + (stale ? " · reconnecting…" : "");
    $("age").style.color = stale ? "var(--fail)" : "";
  }
  setInterval(tick, 1000);

  function connect() {
    if (client) return;
    client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
      clientId: "ddlc-track-" + Math.random().toString(16).slice(2, 10), reconnectPeriod: 3000, connectTimeout: 10000, clean: true,
    });
    client.on("connect", () => { setConn("live", "on"); if (topic) client.subscribe(topic); });
    client.on("reconnect", () => setConn("reconnecting", ""));
    client.on("offline", () => setConn("offline", "off"));
    client.on("error", () => setConn("error", "off"));
    client.on("message", (t, buf) => {
      if (t !== topic) return;
      try { gotAt = Date.now(); render(JSON.parse(buf.toString())); setConn("live", "on"); } catch (e) {}
    });
  }

  function track(id) {
    if (!/^\d{3}$/.test(id)) { $("askerr").textContent = "The ID is 3 digits, e.g. 482."; $("askerr").hidden = false; return; }
    if (client && topic) client.unsubscribe(topic);
    topic = "ddlc-os/track/" + id; last = null; gotAt = 0;
    $("topic").textContent = topic; $("idshow").textContent = id;
    $("headline").textContent = "Waiting for flash #" + id + "…";
    $("state").textContent = "waiting"; $("state").className = "state idle"; $("pct").textContent = "–";
    $("arc").style.strokeDashoffset = 251.3; $("meta").textContent = ""; $("age").textContent = ""; $("log").textContent = "–";
    $("steps").innerHTML = '<div class="empty">No status for this ID yet. Is the flash running?</div>';
    $("ask").hidden = true; $("view").hidden = false;
    history.replaceState(null, "", "?id=" + id);
    try { localStorage.setItem("ddlc-track-id", id); } catch (e) {}
    connect();
    if (client.connected) client.subscribe(topic);
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); track($("idbox").value.trim()); });
  $("idbox").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3); $("askerr").hidden = true; });
  $("other").addEventListener("click", () => {
    if (client && topic) client.unsubscribe(topic);
    topic = null; $("view").hidden = true; $("ask").hidden = false; history.replaceState(null, "", location.pathname);
    $("idbox").value = ""; $("idbox").focus();
  });

  // Phones drop WebSockets silently (screen off, network switch): reconnect after 15 s of silence.
  setInterval(() => {
    if (client && topic && last && last.state === "running" && Date.now() - gotAt > 15000) {
      gotAt = Date.now() - 10000; setConn("reconnecting", ""); client.end(true, () => client.reconnect());
    }
  }, 5000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && client && last && last.state === "running" && Date.now() - gotAt > 8000) client.end(true, () => client.reconnect());
  });

  const qid = new URLSearchParams(location.search).get("id");
  if (qid) track(qid);
  else { try { const s = localStorage.getItem("ddlc-track-id"); if (s) $("idbox").placeholder = s; } catch (e) {} $("idbox").focus(); }

  // Remove the old SMART LAB offline cache from phones that installed it.
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
</script>
</body>
</html>
